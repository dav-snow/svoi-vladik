# Minimal CI: backend tests, frontend unit tests, and content/build checks.
# No secrets are required: quest answer keys are optional and the build check
# skips them when data/private/quest-answers.json is absent.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: pytest
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend tests and content check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Unit tests (node)
        run: node --test frontend-design/tests/
      - name: Content/build check (no writes)
        run: node scripts/build.mjs --check-only
